name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-13
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install automake libtool pkg-config cmake boost miniupnpc libnatpmp zeromq berkeley-db@4 qt@5

      - name: Build FixedCoin
        run: |
          export PATH="/opt/homebrew/opt/qt@5/bin:/usr/local/opt/qt@5/bin:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/qt@5/lib -L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/qt@5/include -I/usr/local/opt/qt@5/include"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/qt@5/lib/pkgconfig:/usr/local/opt/qt@5/lib/pkgconfig"
          
          cd depends
          make HOST=x86_64-apple-darwin -j$(sysctl -n hw.ncpu) NO_QT=0
          cd ..
          
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release --toolchain ../depends/x86_64-apple-darwin/toolchain.cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Create package
        run: |
          mkdir -p release/fixedcoin-29.0.0/bin
          cp build/bin/fixedcoind release/fixedcoin-29.0.0/bin/
          cp build/bin/fixedcoin-cli release/fixedcoin-29.0.0/bin/
          cp build/bin/fixedcoin-qt release/fixedcoin-29.0.0/bin/
          cp build/bin/fixedcoin-tx release/fixedcoin-29.0.0/bin/
          cp build/bin/fixedcoin-wallet release/fixedcoin-29.0.0/bin/
          cp build/bin/fixedcoin-util release/fixedcoin-29.0.0/bin/
          
          strip release/fixedcoin-29.0.0/bin/*
          
          cd release
          tar -czvf fixedcoin-29.0.0-x86_64-apple-darwin.tar.gz fixedcoin-29.0.0/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixedcoin-29.0.0-x86_64-apple-darwin
          path: release/fixedcoin-29.0.0-x86_64-apple-darwin.tar.gz

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/fixedcoin-29.0.0-x86_64-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
