name: Build macOS
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'
jobs:
  build-macos:
    runs-on: macos-13
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install automake libtool pkg-config cmake create-dmg
      - name: Build depends
        run: |
          cd depends
          make HOST=x86_64-apple-darwin -j$(sysctl -n hw.ncpu)
      - name: Build FixedCoin
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                --toolchain ../depends/x86_64-apple-darwin/toolchain.cmake \
                ..
          make -j$(sysctl -n hw.ncpu)
      - name: Create tar.gz package
        run: |
          mkdir -p release/fixedcoin-29.1.0/bin
          cp build/bin/fixedcoind release/fixedcoin-29.1.0/bin/
          cp build/bin/fixedcoin-cli release/fixedcoin-29.1.0/bin/
          cp build/bin/fixedcoin-qt release/fixedcoin-29.1.0/bin/
          cp build/bin/fixedcoin-tx release/fixedcoin-29.1.0/bin/
          cp build/bin/fixedcoin-wallet release/fixedcoin-29.1.0/bin/
          cp build/bin/fixedcoin-util release/fixedcoin-29.1.0/bin/
          
          strip release/fixedcoin-29.1.0/bin/*
          
          cd release
          tar -czvf fixedcoin-29.1.0-x86_64-apple-darwin.tar.gz fixedcoin-29.1.0/
      - name: Create DMG installer
        run: |
          mkdir -p dmg_contents
          
          mkdir -p "dmg_contents/FixedCoin-Qt.app/Contents/MacOS"
          mkdir -p "dmg_contents/FixedCoin-Qt.app/Contents/Resources"
          
          cp build/bin/fixedcoin-qt "dmg_contents/FixedCoin-Qt.app/Contents/MacOS/"
          cp src/qt/res/icons/fixedcoin.icns "dmg_contents/FixedCoin-Qt.app/Contents/Resources/fixedcoin.icns"
          
          cat > "dmg_contents/FixedCoin-Qt.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>fixedcoin-qt</string>
              <key>CFBundleIconFile</key>
              <string>fixedcoin.icns</string>
              <key>CFBundleIdentifier</key>
              <string>org.fixedcoin.FixedCoin-Qt</string>
              <key>CFBundleName</key>
              <string>FixedCoin-Qt</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>29.1.0</string>
              <key>CFBundleVersion</key>
              <string>29.1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          
          create-dmg \
            --volname "FixedCoin Core" \
            --volicon "src/qt/res/icons/fixedcoin.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "FixedCoin-Qt.app" 150 185 \
            --app-drop-link 450 185 \
            "release/fixedcoin-29.1.0-x86_64-apple-darwin.dmg" \
            "dmg_contents/"
      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixedcoin-29.1.0-x86_64-apple-darwin-tar
          path: release/fixedcoin-29.1.0-x86_64-apple-darwin.tar.gz
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixedcoin-29.1.0-x86_64-apple-darwin-dmg
          path: release/fixedcoin-29.1.0-x86_64-apple-darwin.dmg
